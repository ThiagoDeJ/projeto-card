<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body{
            background: linear-gradient(-45deg,rgb(199, 172, 54), rgba(163, 14, 14, 0.993), rgb(245, 158, 29));
            background-size: 400% 100%;
            animation: gradientBG 10s ease infinite;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
            color: aliceblue;
        }
        @keyframes gradientBG{
            0%{background-position: 0% 50%;}
            50%{background-position: 100% 50%;}
            100%{background-position: 0% 50%;}
        }
        .card{
            background: rgb(218, 121, 11);
            padding: 20px;
            border-radius: 12px;
            width: 320px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(247, 132, 0, 0.815);
        }
        .imgperfil{
            width: 140px;
            height: 130px;
            border-radius: 50%;
            border: 5px solid rgb(250, 225, 1);
            margin-bottom: 12px;
            object-fit:fill;
        }
        h2{
            margin: 10px 0 5px;
            font-size: 30px;
        }
        .local{
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 10px;
        }
        .job{
            line-height: 1.5;
        }
        .botoes{
            margin: 20px 0;
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .btn{
            color: black;
            background-color: aliceblue;
            text-decoration: none;
            text-align: center;
            display: inline-block;
            padding: 10px 18px;
            border-radius: 6px;
            border: 1px solid rgba(218, 121, 11);
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }
        .btn:hover{
            opacity: 0.8;
            background: rgb(201, 198, 198);
        }
        .skills{
            margin-top: 15px;
            text-align: left;
        }
        .skills h3{
            font-size: 20px;
            margin-bottom: 10px;
        }
        .tags{
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .tag{
            border: 1px solid aliceblue;
            padding: 5px 10px;
            border-radius: 4px;
        }
        .social-media{
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
            font-size: 20px;
        }
        .social-media i{
            cursor: pointer;
            transition: 0.3s;
        }
        .social-media i:hover{
            color: aliceblue;
            transform: scale(1.2);
        }
        .social-media a{
            text-decoration: none;
            color: aliceblue;
        }
        .social-media a:hover{
            color: rgb(4, 0, 255);
            transform: scale(1.2);
        }

    </style>
</head>
<body>
    <div class="card">
        <img src="Russ.png" alt="Foto de Perfil" class="imgperfil">
        <h2>Thiago de Jesus Santos</h2>
        <div class="local">Montes Claros - MG</div>
        <div class="job">Técnico em Informática<br>Aluno Senac</div>

        <div class="botoes">
        <a href="https://wa.me/5538992303780?text=Olá,%20vim%20pelo%20card."target="_blank" class="btn primario">Mensagem</a>
        <a href="https://github.com/ThiagoDeJ"target="_blank" class="btn secundario">Follow</a>
        </div>

        <div class="skills">
            <h3>Habilidades</h3>
            <div class="tags">
                <span class="tag">Hardware</span>
                <span class="tag">Redes</span>
                <span class="tag">Conhecimento em Packet Tracer</span>
                <span class="tag">Estruturação de Redes</span>
                <span class="tag">Programação</span>
                <span class="tag">HTML</span>
                <span class="tag">PYTHON</span>
                <span class="tag">CSS</span>
            </div>
        </div>
            <div class="social-media">

            <a href="https://facebook.com/thiago.jesus.79656"target="_blank">
            <i class="fab fa-facebook"></i></a>

            <a href="https://github.com/ThiagoDeJ"target="_blank">
            <i class="fab fa-github" ></i></a>

            <a href="https://instagram.com/thiagojs_0/"target="_blank">
            <i class="fab fa-instagram"></i></a>

            <a href="https://www.linkedin.com/in/thiago-santos-a426593b3/"target="_blank">
            <i class="fab fa-linkedin"></i></a>
            </div>

    </div>
</body>
</html>
